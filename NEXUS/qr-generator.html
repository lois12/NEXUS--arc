<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR GENERATOR - NEXUS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-body">
    <div class="qr-container">
        <h2 class="section-title glitch-text" data-text="QR GENERATOR">QR GENERATOR</h2>
        
        <div class="qr-panel glass-panel">
            <div class="input-group">
                <label for="qr-text">Введите ссылку или текст:</label>
                <textarea id="qr-text" placeholder="https://nexus-core.com..." rows="3"></textarea>
            </div>

            <div class="settings-grid">
                <div class="setting-item">
                    <label>Цвет QR:</label>
                    <input type="color" id="qr-color" value="#ff6b9d">
                </div>
                <div class="setting-item">
                    <label>Цвет фона:</label>
                    <input type="color" id="qr-bg-color" value="#ffffff">
                </div>
                <div class="setting-item">
                    <label>Размер (px):</label>
                    <input type="number" id="qr-size" value="300" min="100" max="1000">
                </div>
                <div class="setting-item">
                    <label>Отступы:</label>
                    <input type="number" id="qr-margin" value="2" min="0" max="10">
                </div>
            </div>

            <button id="generate-btn" class="cyber-btn">
                <span>ГЕНЕРИРОВАТЬ</span>
                <div class="glitch-layer"></div>
            </button>

            <div id="qr-result" class="qr-result hidden">
                <canvas id="qr-canvas"></canvas>
                <div class="qr-actions">
                    <button id="download-png" class="action-btn">Скачать PNG</button>
                    <button id="download-svg" class="action-btn">Скачать SVG</button>
                </div>
            </div>

            <div id="status-message" class="status-message"></div>
        </div>

        <div class="history-panel glass-panel">
            <h3>История генераций</h3>
            <div id="history-list" class="history-list"></div>
        </div>
    </div>

    <script src="nexus-js/lib/qrcode.min.js"></script>
    <script src="nexus-js/utils.js"></script>
    <script src="nexus-js/main.js"></script>
    <script src="nexus-js/qr-generator.js"></script>
</body>
</html>
